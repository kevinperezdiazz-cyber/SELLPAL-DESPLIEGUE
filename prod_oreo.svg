<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="oreoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="#f0f9ff" rx="16"/>
  <!-- Oreo Cookie Representation -->
  <g transform="translate(100, 100)">
    <!-- Back Cookie -->
    <ellipse cx="0" cy="18" rx="60" ry="25" fill="#1e293b"/>
    <ellipse cx="0" cy="12" rx="60" ry="25" fill="#0f172a"/>
    <!-- Cream Filling -->
    <ellipse cx="0" cy="0" rx="58" ry="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Front Cookie -->
    <ellipse cx="0" cy="-14" rx="60" ry="25" fill="#1e293b"/>
    <ellipse cx="0" cy="-18" rx="58" ry="23" fill="#334155"/>
    <ellipse cx="0" cy="-20" rx="46" ry="17" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="0" y="-14" font-family="'Impact', sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="2">OREO</text>
  </g>
  <!-- Brand Badge -->
  <rect x="20" y="15" width="65" height="20" rx="4" fill="#0284c7"/>
  <text x="52" y="29" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">MONDELEZ</text>
</svg>
