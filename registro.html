<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Mayorista | SELLPAL INVERCAJAS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-dark navbar-corporate">
    <div class="container justify-content-between">
      <a class="navbar-brand" href="../index.html">
        <img src="../assets/img/logo_invercajas.svg" alt="SELLPAL" height="38">
      </a>
      <a href="login.html" class="btn btn-outline-light btn-sm">
        <i class="bi bi-box-arrow-in-right me-1"></i> Ya tengo cuenta
      </a>
    </div>
  </nav>

  <div class="auth-wrapper my-4">
    <div class="auth-card" style="max-width: 680px;">
      <div class="auth-header">
        <span class="badge bg-warning text-dark px-3 py-1 fw-bold text-uppercase mb-2">Canal Distribuidor B2B</span>
        <h3 class="fw-bold text-white mb-1">Registro de Cliente Comercial</h3>
        <p class="text-light opacity-75 small mb-0">Crea tu cuenta para acceder a precios mayoristas y catálogo en tiempo real</p>
      </div>

      <div class="auth-body">
        <form id="registerForm" onsubmit="handleRegisterSubmit(event)">
          <div class="row g-3">
            
            <div class="col-md-4">
              <label class="form-label small fw-bold">Tipo Documento</label>
              <select class="form-select" id="regTipoDoc" required>
                <option value="NIT">NIT (Empresas)</option>
                <option value="CC">Cédula de Ciudadanía</option>
                <option value="CE">Cédula de Extranjería</option>
              </select>
            </div>

            <div class="col-md-8">
              <label class="form-label small fw-bold">Número de Identificación / NIT</label>
              <input type="text" class="form-control" id="regDocumento" placeholder="Ej. 901.234.567-8" required>
            </div>

            <div class="col-12">
              <label class="form-label small fw-bold">Razón Social o Nombre Comercial</label>
              <input type="text" class="form-control" id="regNombre" placeholder="Ej. Minimercado San Carlos / Distribuciones Gómez" required>
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-bold">Correo Electrónico de Facturación</label>
              <input type="email" class="form-control" id="regEmail" placeholder="compras@negocio.com" required>
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-bold">Teléfono Celular / WhatsApp</label>
              <input type="tel" class="form-control" id="regTelefono" placeholder="Ej. 315 890 1234" required>
            </div>

            <div class="col-md-8">
              <label class="form-label small fw-bold">Dirección Principal de Entrega</label>
              <input type="text" class="form-control" id="regDireccion" placeholder="Calle, carrera, número y barrio" required>
            </div>

            <div class="col-md-4">
              <label class="form-label small fw-bold">Ciudad / Municipio</label>
              <input type="text" class="form-control" id="regCiudad" placeholder="Ej. Bogotá" value="Bogotá" required>
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-bold">Contraseña de Acceso</label>
              <div class="input-group">
                <input type="password" class="form-control" id="regPassword" placeholder="Crea una contraseña segura" required>
                <button class="btn btn-outline-secondary password-toggle-btn" type="button" onclick="PasswordValidator.toggleVisibility('regPassword', this)" title="Mostrar contraseña">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
              <div class="password-strength-container mt-2">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <span class="small text-muted" id="regStrengthFeedback">Mínimo 8 caracteres, mayúsculas, números y símbolos</span>
                </div>
                <div class="password-strength-meter">
                  <div class="progress-bar" id="regStrengthBar" style="width: 0%"></div>
                </div>
                <div class="password-rules-list mt-2" id="regChecklist"></div>
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label small fw-bold">Confirmar Contraseña</label>
              <div class="input-group">
                <input type="password" class="form-control" id="regPasswordConfirm" placeholder="Repite tu contraseña" required>
                <button class="btn btn-outline-secondary password-toggle-btn" type="button" onclick="PasswordValidator.toggleVisibility('regPasswordConfirm', this)" title="Mostrar contraseña">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
              <div id="regMatchIndicator" class="mt-2"></div>
            </div>

            <div class="col-12">
              <div class="form-check small">
                <input class="form-check-input" type="checkbox" id="regTerms" required>
                <label class="form-check-label text-muted" for="regTerms">
                  Acepto los términos y condiciones de distribución comercial y la política de tratamiento de datos personales de INVERCAJAS S.A.S.
                </label>
              </div>
            </div>

            <div class="col-12 mt-4">
              <button type="submit" class="btn btn-accent w-100 py-2 fw-bold" id="regSubmitBtn">
                <i class="bi bi-check2-circle me-1"></i> Crear Cuenta y Empezar a Comprar
              </button>
            </div>

          </div>
        </form>

        <div class="text-center small text-muted mt-3">
          ¿Ya tienes cuenta activa? <a href="login.html" class="fw-bold text-primary">Inicia sesión</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/password-validator.js"></script>

  <script>
    let validatorInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
      validatorInstance = PasswordValidator.attach({
        inputId: 'regPassword',
        confirmInputId: 'regPasswordConfirm',
        meterBarId: 'regStrengthBar',
        feedbackTextId: 'regStrengthFeedback',
        checklistContainerId: 'regChecklist',
        matchIndicatorId: 'regMatchIndicator'
      });
    });

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const pass = document.getElementById('regPassword').value;
      const passConf = document.getElementById('regPasswordConfirm').value;

      const evalResult = PasswordValidator.evaluate(pass);
      if (!evalResult.isValid) {
        alert('Por seguridad, tu contraseña debe cumplir al menos con 4 de las 5 reglas de seguridad (mínimo 8 caracteres, mayúsculas, minúsculas, números y símbolos).');
        return;
      }

      if (pass !== passConf) {
        alert('Las contraseñas no coinciden. Por favor verifica que ambas sean idénticas.');
        return;
      }

      const formData = {
        tipoDocumento: document.getElementById('regTipoDoc').value,
        documento: document.getElementById('regDocumento').value.trim(),
        nombre: document.getElementById('regNombre').value.trim(),
        email: document.getElementById('regEmail').value.trim(),
        telefono: document.getElementById('regTelefono').value.trim(),
        direccion: document.getElementById('regDireccion').value.trim(),
        ciudad: document.getElementById('regCiudad').value.trim(),
        password: pass,
        passwordConfirm: passConf
      };

      const result = await Auth.register(formData);
      if (!result || !result.success) {
        alert((result && result.message) || 'No se pudo completar el registro.');
        return;
      }

      if (window.ApiService && typeof ApiService.logActivity === 'function') {
        ApiService.logActivity('CREACIÓN', 'Clientes', `Solicitud de registro: ${formData.nombre} (${formData.email}) — pendiente de aprobación`, formData.nombre, 'Cliente');
      }

      alert('¡Registro recibido, ' + formData.nombre + '!\n\nTu cuenta de tienda quedó PENDIENTE de aprobación por un administrador de INVERCAJAS.\nCuando sea activada podrás iniciar sesión con tu correo y contraseña.');
      window.location.href = 'login.html';
    }
  </script>
  <script src="../js/chatbot.js"></script>
</body>
</html>
