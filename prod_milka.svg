<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#faf5ff" rx="16"/>
  <g transform="translate(40, 50)">
    <!-- Milka Bar Lilac -->
    <rect x="0" y="0" width="120" height="88" rx="8" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/>
    <rect x="10" y="10" width="100" height="68" rx="4" fill="#8b5cf6"/>
