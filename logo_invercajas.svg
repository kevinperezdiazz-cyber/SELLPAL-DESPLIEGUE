<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="320" height="70">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Isometric Box Icon -->
  <g transform="translate(10, 8)">
    <!-- Top Face -->
    <polygon points="25,5 45,16 25,27 5,16" fill="url(#accentGrad)" />
    <!-- Left Face -->
    <polygon points="5,16 25,27 25,49 5,38" fill="url(#boxGrad)" />
    <!-- Right Face -->
    <polygon points="25,27 45,16 45,38 25,49" fill="#c2410c" />
    <!-- Tape / Ribbon detail -->
    <polygon points="20,13 25,16 25,49 20,46" fill="#fde68a" opacity="0.8" />
    <!-- Checkmark inside box top -->
    <path d="M21,14 L24,17 L29,12" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Corporate Text: SELLPAL -->
  <text x="68" y="32" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="1">
    SELL<tspan fill="#f59e0b">PAL</tspan>
  </text>

  <!-- Subtitle: INVERCAJAS -->
  <text x="69" y="48" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="700" font-size="11" fill="#94a3b8" letter-spacing="2.5">
    INVERCAJAS S.A.S.
  </text>
  
  <rect x="69" y="54" width="130" height="2" fill="#f97316" rx="1" />
</svg>
